name: Security Review

# Contrôle de sécurité de chaque PR, sans aucun crédit IA (décision de Benj du 11/10/2026 :
# « je veux pas que ça dépense de crédit »). Il remplace la revue Claude payante, qui exigeait le
# secret CLAUDE_API_KEY — et les clés Anthropic restent volontairement hors de GitHub.
#  • Semgrep (open source) : règles publiques JavaScript, TypeScript, React et secrets. Seuls les
#    défauts AJOUTÉS par la PR font échouer le contrôle (--baseline-commit) : l'existant ne bloque pas.
#  • Gitleaks : aucun secret dans les commits de la PR.
# Le job garde le nom « security » pour que le contrôle attendu sur les PR ne change pas de nom.

permissions:
  contents: read

on:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      TETE: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Semgrep (défauts ajoutés par la PR)
        run: |
          pip install --quiet semgrep
          semgrep scan --metrics=off --error \
            --config p/javascript --config p/typescript --config p/react --config p/secrets \
            --baseline-commit "$BASE"

      - name: Gitleaks (secrets dans les commits de la PR)
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --exit-code 1 --log-opts="$BASE..$TETE" .
