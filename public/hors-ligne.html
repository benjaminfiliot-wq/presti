<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0C11">
<title>Hors ligne · Presti</title>
<!--
  Page hors-ligne de l'application (prompt v9 §2.3). Fichier STATIQUE, sans aucun script : précaché par le
  service worker (app/sw.ts), servi à la place de n'importe quelle page Presti quand le réseau manque.
  Pourquoi pas une page Next ? À l'hydratation, Next réclame le chunk JS de la route ; hors ligne il manque,
  et l'écran d'erreur générique remplaçait « Vous êtes hors ligne » (revue du 06/09). Ici : rien à charger.
  « Réessayer » a un href vide : il recharge exactement l'adresse demandée (/messages, /devis/…), sans JS.
  Jamais servie sur une surface d'artisan (/site, /p, /l) : le repli les exclut.
-->
<style>
  html,body{margin:0;background:#0A0C11;color:#ECEAE6;font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  main{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:2rem;padding-bottom:calc(2rem + env(safe-area-inset-bottom));text-align:center;box-sizing:border-box}
  .b{max-width:440px}
  .m{width:56px;height:56px;border-radius:14px;margin:0 auto 1.4rem;background:#141319;border:1px solid rgba(255,255,255,.08);display:grid;place-items:center}
  .m img{width:30px;height:30px;display:block}
  h1{font-size:1.5rem;margin:0 0 .6rem;line-height:1.2;font-weight:650}
  p{color:#C7C2BA;line-height:1.55;margin:0 0 1.6rem;font-size:.98rem}
  .a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.7rem 1.4rem;border-radius:11px;font-weight:650;text-decoration:none;color:#1a0f0a;background:#D97757}
  .s{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.7rem 1rem;margin-left:.6rem;border-radius:11px;font-weight:600;text-decoration:none;color:#C7C2BA;border:1px solid rgba(255,255,255,.12)}
  .a:focus-visible,.s:focus-visible{outline:2px solid #E8946F;outline-offset:3px}
  @media (max-width:420px){.s{margin:.7rem 0 0}}
</style>
</head>
<body>
<main data-presti-hors-ligne="1">
  <div class="b">
    <div class="m"><img src="/marque/presti-marque-corail.svg" alt="" width="30" height="30"></div>
    <h1>Vous êtes hors ligne</h1>
    <p>Presti a besoin d’une connexion pour afficher vos conversations, vos devis et vos factures. Rien n’est perdu&nbsp;: dès que le réseau revient, tout est là.</p>
    <a class="a" href="">Réessayer</a><a class="s" href="/dashboard">Tableau de bord</a>
  </div>
</main>
</body>
</html>
